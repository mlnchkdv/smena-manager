name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:server
      - run: npm run build
  e2e:
    needs: build
    runs-on: ubuntu-latest
    # WebKit's OS dependencies can take most of a 15-minute job on a fresh runner.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 18
      - name: Critical deployment acceptance (RU/EN, desktop/mobile)
        timeout-minutes: 15
        env:
          E2E_DEPLOYMENT_GATE: true
        run: npx playwright test --project=${{ matrix.browser }} --grep "deployment acceptance|core task flow and responsive shell|mobile navigation keeps focus|an ordinary member creates and configures owned workspaces|quick capture preserves text when its file upload fails"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-acceptance-${{ matrix.browser }}
          path: |
            .data/e2e/**/report/
            .data/e2e/**/results/
          if-no-files-found: ignore

  deploy:
    needs: [build, e2e]
    if: github.repository == 'mlnchkdv/smena-manager' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: aeza-production
      url: https://smena.team
    concurrency:
      group: aeza-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Publish the checked commit and verify the public release
        env:
          SMENA_VPS_HOST: ${{ vars.SMENA_VPS_HOST }}
          SMENA_VPS_PORT: ${{ vars.SMENA_VPS_PORT }}
          SMENA_VPS_KNOWN_HOSTS: ${{ vars.SMENA_VPS_KNOWN_HOSTS }}
          SMENA_VPS_SSH_KEY: ${{ secrets.SMENA_VPS_SSH_KEY }}
        run: node deploy/vps/ci-client.mjs
