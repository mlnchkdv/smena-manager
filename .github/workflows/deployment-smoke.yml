name: Deployment smoke

on:
  schedule:
    - cron: '7,37 * * * *'
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      url:
        description: Public deployment origin (read-only checks)
        required: true
        default: https://smena.team

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check public frontend, API, sign-in and access protection
        run: node scripts/smoke-deployment.js "$DEPLOYMENT_URL" --allow-custom-origin
        env:
          # Immutable deployment URLs may be SSO-protected even in production.
          # Check the public alias without bypass credentials or redirects.
          DEPLOYMENT_URL: ${{ inputs.url || (github.event_name == 'repository_dispatch' && 'https://smena-manager.vercel.app') || 'https://smena.team' }}
